services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-restaurant_pos}
      DB_USER: ${POSTGRES_USER:-restaurant}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_dev_password}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8081/realms/restaurant-pos
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/restaurant-pos/protocol/openid-connect/certs
      APP_KEYCLOAK_CLIENT_SECRET: ${APP_KEYCLOAK_CLIENT_SECRET:-change-me}
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
    healthcheck: {test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health >/dev/null"], interval: 10s, timeout: 5s, retries: 12}
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    ports: ["8081:8080"]
    environment: {KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}, KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}}
    volumes: ["./infrastructure/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    healthcheck: {test: ["CMD-SHELL","/opt/keycloak/bin/kc.sh show-config >/dev/null"], interval: 10s, timeout: 5s, retries: 12}
  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment: {POSTGRES_DB: ${POSTGRES_DB:-restaurant_pos}, POSTGRES_USER: ${POSTGRES_USER:-restaurant}, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_dev_password}}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 20}
volumes: {postgres-data: {}}
